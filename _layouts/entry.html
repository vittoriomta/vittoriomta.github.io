<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#14120b">
    <title>{{ page.title | escape }} — {{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% if page.assets %}<link rel="stylesheet" href="{{ '/assets/' | append: page.assets | append: '/page.css' | relative_url }}">{% endif %}
  </head>

  <body>
    <main class="site-shell">
      <a class="back-link" href="{{ '/' | relative_url }}">← Vittorio Marton</a>

      <article>
        <header class="entry-header">
          <h1>{{ page.title }}</h1>
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d/%m/%Y" }}</time>
        </header>

        <div class="prose">
          {{ content }}
        </div>
      </article>
      {% if page.toc %}<nav class="toc" aria-label="On this page"></nav>{% endif %}
    </main>
    {% if page.toc %}<script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>{% endif %}
    {% if page.assets %}<script src="{{ '/assets/' | append: page.assets | append: '/page.js' | relative_url }}" defer></script>{% endif %}
  </body>
</html>
